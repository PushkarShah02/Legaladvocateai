name: AI Advocate checks
on:
  push:
    branches: [main]
    paths: ['agent/**', '.github/workflows/agent-checks.yml']
  pull_request:
    paths: ['agent/**', '.github/workflows/agent-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: agent
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v1
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q
  conversations:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v1
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - id: credentials
        shell: bash
        run: |
          if [[ -n "$LIVEKIT_URL" && -n "$LIVEKIT_API_KEY" && -n "$LIVEKIT_API_SECRET" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Live conversation checks skipped: repository LiveKit secrets are not configured."
          fi
      - if: steps.credentials.outputs.ready == 'true'
        run: uv sync --locked
      - if: steps.credentials.outputs.ready == 'true'
        run: uv run python scripts/evaluate.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.credentials.outputs.ready == 'true'
        with:
          name: synthetic-consultation-raw-outputs
          path: agent/test-results/
